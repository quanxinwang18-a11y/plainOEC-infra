<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Dev 与 Engineering Skill 能力地图</title>
  <desc id="desc">主 Session 负责普通编码，十个稳定 Engineering Skills 分为团队知识、决策规划、任务执行、实现诊断、评审收口五类按需能力；实验性长时编排位于 oec-dev-beta。</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09264f"/>
      <stop offset="1" stop-color="#154d76"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .navy { fill: #0b2d57; }
      .muted { fill: #617384; }
      .code { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1672" height="941" fill="#fbfaf6"/>
  <circle cx="1598" cy="42" r="210" fill="#e8f4f2"/>
  <circle cx="42" cy="920" r="230" fill="#eef3fb"/>

  <text x="70" y="82" class="navy" font-size="46" font-weight="800">Dev / Engineering Skill 能力地图</text>
  <text x="70" y="122" class="muted" font-size="23">主 Session 承担普通编码；十个稳定 Skill 只在目标匹配时补充团队特有方法</text>

  <rect x="70" y="151" width="1532" height="92" rx="24" fill="url(#navy)"/>
  <text x="112" y="190" fill="#bfe8eb" font-size="18" font-weight="700">默认研发入口</text>
  <text x="112" y="222" fill="#fff" font-size="25" font-weight="800">主 Session：定位代码 → 直接修改 → 最小相关测试 → 报告结果</text>
  <rect x="1322" y="173" width="238" height="48" rx="24" fill="#fff" opacity="0.14"/>
  <text x="1441" y="204" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">没有总控 Dev Agent</text>

  <g filter="url(#shadow)">
    <rect x="70" y="276" width="358" height="474" rx="26" fill="#fff" stroke="#61aaa6" stroke-width="2"/>
    <rect x="454" y="276" width="358" height="474" rx="26" fill="#fff" stroke="#729bc8" stroke-width="2"/>
    <rect x="838" y="276" width="358" height="474" rx="26" fill="#fff" stroke="#7aae75" stroke-width="2"/>
    <rect x="1222" y="276" width="380" height="474" rx="26" fill="#fff" stroke="#d8a448" stroke-width="2"/>
  </g>

  <rect x="70" y="276" width="358" height="76" rx="26" fill="#e7f5f3"/>
  <rect x="70" y="326" width="358" height="26" fill="#e7f5f3"/>
  <text x="249" y="323" fill="#0b6f76" font-size="25" font-weight="800" text-anchor="middle">团队知识</text>

  <rect x="454" y="276" width="358" height="76" rx="26" fill="#eaf1fa"/>
  <rect x="454" y="326" width="358" height="26" fill="#eaf1fa"/>
  <text x="633" y="323" fill="#245f9e" font-size="25" font-weight="800" text-anchor="middle">决策与规划</text>

  <rect x="838" y="276" width="358" height="76" rx="26" fill="#edf6ea"/>
  <rect x="838" y="326" width="358" height="26" fill="#edf6ea"/>
  <text x="1017" y="323" fill="#39753b" font-size="25" font-weight="800" text-anchor="middle">实现与诊断</text>

  <rect x="1222" y="276" width="380" height="76" rx="26" fill="#fff4df"/>
  <rect x="1222" y="326" width="380" height="26" fill="#fff4df"/>
  <text x="1412" y="323" fill="#a96500" font-size="25" font-weight="800" text-anchor="middle">评审与收口</text>

  <rect x="94" y="378" width="310" height="138" rx="18" fill="#f4fbfa" stroke="#bfddda"/>
  <text x="112" y="411" class="navy code" font-size="18" font-weight="800">spec-manage</text>
  <text x="112" y="445" fill="#0b6f76" font-size="19" font-weight="700">管理团队工程事实</text>
  <text x="112" y="477" class="muted" font-size="17">创建 / 更新 Specs、ADRs</text>
  <text x="112" y="501" class="muted" font-size="17">及必要 change context</text>

  <rect x="94" y="540" width="310" height="154" rx="18" fill="#f4fbfa" stroke="#bfddda"/>
  <text x="112" y="573" class="navy code" font-size="17" font-weight="800">legacy-doc-migrate</text>
  <text x="112" y="607" fill="#0b6f76" font-size="19" font-weight="700">迁移仍被代码证明的旧事实</text>
  <text x="112" y="639" class="muted" font-size="17">不复制旧目录树，不清理状态</text>
  <rect x="112" y="656" width="112" height="25" rx="13" fill="#def0ed"/>
  <text x="168" y="674" fill="#0b6f76" font-size="14" font-weight="800" text-anchor="middle">自然语言发现</text>

  <rect x="478" y="368" width="310" height="106" rx="18" fill="#f5f8fc" stroke="#c7d6e8"/>
  <text x="496" y="400" class="navy code" font-size="16" font-weight="800">decision-challenge</text>
  <text x="496" y="433" fill="#245f9e" font-size="18" font-weight="700">压力测试技术决定</text>
  <rect x="650" y="440" width="118" height="24" rx="12" fill="#e3ecf7"/>
  <text x="709" y="457" fill="#245f9e" font-size="13" font-weight="800" text-anchor="middle">自然语言发现</text>

  <rect x="478" y="492" width="310" height="100" rx="18" fill="#f5f8fc" stroke="#c7d6e8"/>
  <text x="496" y="525" class="navy code" font-size="17" font-weight="800">design-prototype</text>
  <text x="496" y="558" fill="#245f9e" font-size="18" font-weight="700">用最小原型回答设计问题</text>

  <rect x="478" y="610" width="310" height="106" rx="18" fill="#f5f8fc" stroke="#c7d6e8"/>
  <text x="496" y="643" class="navy code" font-size="17" font-weight="800">change-plan</text>
  <text x="496" y="676" fill="#245f9e" font-size="18" font-weight="700">规划非平凡、跨模块变更</text>
  <text x="496" y="701" class="muted" font-size="16">高风险时才持久化计划</text>

  <rect x="862" y="368" width="310" height="76" rx="18" fill="#f6fbf4" stroke="#c6ddc2"/>
  <text x="880" y="400" class="navy code" font-size="17" font-weight="800">test-first</text>
  <text x="880" y="430" fill="#39753b" font-size="17" font-weight="700">明确要求时执行 TDD</text>

  <rect x="862" y="458" width="310" height="76" rx="18" fill="#f6fbf4" stroke="#c6ddc2"/>
  <text x="880" y="490" class="navy code" font-size="17" font-weight="800">failure-debug</text>
  <text x="880" y="520" fill="#39753b" font-size="17" font-weight="700">诊断难复现或根因不清故障</text>

  <rect x="862" y="548" width="310" height="88" rx="18" fill="#f6fbf4" stroke="#c6ddc2"/>
  <text x="880" y="580" class="navy code" font-size="17" font-weight="800">change-implement</text>
  <text x="880" y="610" fill="#39753b" font-size="17" font-weight="700">已有 ready 任务的轻量执行</text>

  <text x="880" y="680" class="muted" font-size="16">oec-dev-beta：实验性长时 Web 编排（另装）</text>

  <rect x="1246" y="378" width="332" height="138" rx="18" fill="#fffaf1" stroke="#ead4aa"/>
  <text x="1264" y="411" class="navy code" font-size="17" font-weight="800">code-review</text>
  <text x="1264" y="445" fill="#a96500" font-size="19" font-weight="700">只读、风险优先评审 diff</text>
  <text x="1264" y="477" class="muted" font-size="17">给位置、触发输入、后果</text>
  <text x="1264" y="501" class="muted" font-size="17">和最小修正方向</text>

  <rect x="1246" y="540" width="332" height="154" rx="18" fill="#fffaf1" stroke="#ead4aa"/>
  <text x="1264" y="573" class="navy code" font-size="17" font-weight="800">change-close</text>
  <text x="1264" y="607" fill="#a96500" font-size="19" font-weight="700">核对证据、知识与残余风险</text>
  <text x="1264" y="639" class="muted" font-size="17">用户确认后可精确路径提交</text>
  <rect x="1264" y="656" width="112" height="25" rx="13" fill="#fff0d3"/>
  <text x="1320" y="674" fill="#a96500" font-size="14" font-weight="800" text-anchor="middle">自然语言发现</text>

  <text x="70" y="795" class="navy" font-size="22" font-weight="800">辅助组件（不是上述十个稳定 Skill）</text>
  <rect x="70" y="816" width="520" height="76" rx="18" fill="#eef6f5" stroke="#a7d0cc"/>
  <text x="96" y="849" fill="#0b6f76" class="code" font-size="20" font-weight="800">oec-spec runtime</text>
  <text x="96" y="876" class="muted" font-size="17">按路径选取与确定性校验工程文档</text>
  <rect x="616" y="816" width="986" height="76" rx="18" fill="#eef3fa" stroke="#aec4df"/>
  <text x="642" y="849" fill="#245f9e" font-size="20" font-weight="800">可选 Agents</text>
  <text x="786" y="849" class="navy code" font-size="18" font-weight="700">task-implementer</text>
  <text x="972" y="849" class="navy code" font-size="18" font-weight="700">web-evaluator</text>
  <text x="1150" y="849" class="navy code" font-size="18" font-weight="700">change-checker</text>
  <text x="1292" y="849" class="navy code" font-size="18" font-weight="700">task-researcher</text>
  <text x="642" y="876" class="muted" font-size="17">仅在独立上下文、fresh-eyes 或边界研究确有价值时显式使用</text>
</svg>
