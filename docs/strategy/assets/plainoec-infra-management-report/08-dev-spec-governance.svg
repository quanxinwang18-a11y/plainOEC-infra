<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Dev 工程知识治理</title>
  <desc id="desc">Dev 从代码、配置、测试和正式决定提取事实，按路径选择 Spec，并在验证和显式收口后更新 Spec、ADR 与变更包。</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09264f"/>
      <stop offset="1" stop-color="#154d76"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f7f8b"/>
      <stop offset="1" stop-color="#0c6572"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#31546f"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0d7882"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .navy { fill: #0b2d57; }
      .muted { fill: #617384; }
      .code { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1672" height="941" fill="#fbfaf6"/>
  <circle cx="1612" cy="54" r="210" fill="#e8f4f2"/>
  <circle cx="60" cy="922" r="220" fill="#eef3fb"/>

  <text x="70" y="84" class="navy" font-size="46" font-weight="800">Dev 如何管理 Spec 与工程事实</text>
  <text x="70" y="124" class="muted" font-size="23">Spec 保存当前系统事实；ADR 保存持久决定；Change package 保存本次非平凡变更</text>

  <rect x="70" y="158" width="1532" height="88" rx="22" fill="url(#navy)"/>
  <text x="112" y="194" fill="#bfe8eb" font-size="18" font-weight="700">可验证事实来源</text>
  <text x="112" y="225" fill="#fff" font-size="22" font-weight="700">代码  ·  配置  ·  自动测试  ·  正式架构决定  ·  真实运行证据</text>
  <rect x="1285" y="179" width="269" height="48" rx="24" fill="#fff" opacity="0.14"/>
  <text x="1419" y="210" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">不把模型推测写成事实</text>

  <path d="M836 246 V286" fill="none" stroke="#31546f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="598" y="274" width="476" height="62" rx="22" fill="#e5f4f2" stroke="#79bab5" stroke-width="2"/>
  <text x="836" y="314" fill="#0b6f76" class="code" font-size="22" font-weight="800" text-anchor="middle">knowledge-manage：证据门槛</text>

  <g filter="url(#shadow)">
    <rect x="116" y="365" width="1440" height="274" rx="28" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
  </g>
  <text x="156" y="408" class="navy" font-size="24" font-weight="800">ai-docs/Spec/  ·  团队拥有的工程知识</text>
  <line x1="596" y1="434" x2="596" y2="611" stroke="#d7e0e6" stroke-width="2"/>
  <line x1="1076" y1="434" x2="1076" y2="611" stroke="#d7e0e6" stroke-width="2"/>

  <rect x="156" y="451" width="400" height="134" rx="20" fill="#e9f6f4" stroke="#9acdc8" stroke-width="2"/>
  <text x="184" y="489" fill="#0b6f76" font-size="25" font-weight="800">Current-state Specs</text>
  <text x="184" y="524" class="muted" font-size="19">系统现在必须保持什么</text>
  <text x="184" y="556" class="muted" font-size="18">唯一 id · applies_to 路径范围</text>

  <rect x="636" y="451" width="400" height="134" rx="20" fill="#edf3fb" stroke="#a8bfdd" stroke-width="2"/>
  <text x="664" y="489" fill="#245f9e" font-size="25" font-weight="800">ADRs</text>
  <text x="664" y="524" class="muted" font-size="19">为什么选择长期约束</text>
  <text x="664" y="556" class="muted" font-size="18">新决定取代旧决定，不静默重写历史</text>

  <rect x="1116" y="451" width="400" height="134" rx="20" fill="#fff5e4" stroke="#e8c173" stroke-width="2"/>
  <text x="1144" y="489" fill="#ad6a00" font-size="25" font-weight="800">Change package</text>
  <text x="1144" y="524" class="muted" font-size="19">本次非平凡变更的上下文</text>
  <text x="1144" y="556" class="muted" font-size="18">change.md 必需；设计、计划、证据按需</text>

  <text x="70" y="692" class="navy" font-size="24" font-weight="800">研发使用与回写闭环</text>
  <g filter="url(#shadow)">
    <rect x="70" y="720" width="210" height="92" rx="20" fill="#fff" stroke="#2b6dad" stroke-width="2"/>
    <rect x="338" y="720" width="250" height="92" rx="20" fill="#fff" stroke="#0f7f8b" stroke-width="2"/>
    <rect x="646" y="720" width="250" height="92" rx="20" fill="#fff" stroke="#0f7f8b" stroke-width="2"/>
    <rect x="954" y="720" width="250" height="92" rx="20" fill="#fff" stroke="#2b6dad" stroke-width="2"/>
    <rect x="1262" y="720" width="340" height="92" rx="20" fill="#fff" stroke="#d69008" stroke-width="2"/>
  </g>
  <text x="175" y="758" class="navy" font-size="21" font-weight="800" text-anchor="middle">用户目标 / 代码路径</text>
  <text x="175" y="788" class="muted" font-size="18" text-anchor="middle">确定待改范围</text>
  <text x="463" y="758" fill="#0b6f76" class="code" font-size="20" font-weight="800" text-anchor="middle">oec-spec select</text>
  <text x="463" y="788" class="muted" font-size="18" text-anchor="middle">只加载路径相关 Specs</text>
  <text x="771" y="758" fill="#0b6f76" font-size="21" font-weight="800" text-anchor="middle">实现与验证</text>
  <text x="771" y="788" class="muted" font-size="18" text-anchor="middle">遵守当前约束</text>
  <text x="1079" y="758" fill="#245f9e" class="code" font-size="20" font-weight="800" text-anchor="middle">oec-spec check</text>
  <text x="1079" y="788" class="muted" font-size="18" text-anchor="middle">校验结构与引用</text>
  <text x="1432" y="758" fill="#ad6a00" font-size="21" font-weight="800" text-anchor="middle">显式 closing</text>
  <text x="1432" y="788" class="muted" font-size="18" text-anchor="middle">稳定事实 / 决定 / 证据分别归档</text>

  <path d="M280 766 H330" fill="none" stroke="#31546f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M588 766 H638" fill="none" stroke="#31546f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M896 766 H946" fill="none" stroke="#31546f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1204 766 H1254" fill="none" stroke="#31546f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1432 720 C1432 665, 1316 666, 1316 595" fill="none" stroke="#0d7882" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowTeal)"/>

  <rect x="70" y="852" width="1532" height="54" rx="16" fill="#f1f3f5" stroke="#d8e0e5"/>
  <text x="836" y="886" class="muted" font-size="19" font-weight="700" text-anchor="middle">不进入 Spec：产品 PRD · 单次实施步骤 · 临时评审结论 · 无代码证据的偏好或推测</text>
</svg>
