<!doctype html>
<!--
  Zero-dependency HTML deck shell adapted from Huashu-Design under the MIT license.
  Keep the shell deterministic: grid overview, no remote imports, no random modes, no persistence.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML slide deck</title>
  <style>
    :root {
      color-scheme: dark;
      --shell-bg: #11110f;
      --overview-bg: #ece9e1;
      --overview-ink: #24221d;
      --card-bg: #ffffff;
      --card-radius: 12px;
      --card-shadow: 0 18px 60px rgba(28, 25, 18, 0.18);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--shell-bg); font-family: ui-sans-serif, system-ui, sans-serif; }
    button { font: inherit; }

    #overview {
      position: fixed;
      inset: 0;
      overflow: auto;
      padding: 64px clamp(24px, 5vw, 80px) 96px;
      background: var(--overview-bg);
      color: var(--overview-ink);
    }

    .overview-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      max-width: 1680px;
      margin: 0 auto 32px;
    }

    .overview-title { margin: 0; font-size: clamp(28px, 3vw, 48px); letter-spacing: -0.03em; }
    .overview-help { margin: 0; color: #6a6559; font-size: 14px; }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
      gap: clamp(20px, 2.5vw, 36px);
      max-width: 1680px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: var(--card-radius);
      background: var(--card-bg);
      box-shadow: var(--card-shadow);
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 24px 72px rgba(28, 25, 18, 0.24);
      outline: 3px solid #2f6feb;
      outline-offset: 4px;
    }

    .thumb { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .thumb iframe {
      display: block;
      width: 1920px;
      height: 1080px;
      border: 0;
      transform-origin: top left;
      pointer-events: none;
      background: #fff;
    }

    .card-label {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 2;
      max-width: calc(100% - 28px);
      padding: 7px 10px;
      border-radius: 7px;
      background: rgba(18, 18, 16, 0.86);
      color: #fff;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #player { position: fixed; inset: 0; display: none; background: var(--shell-bg); }
    #stage { position: absolute; width: 1920px; height: 1080px; transform-origin: top left; }
    #frame { display: block; width: 1920px; height: 1080px; border: 0; background: #fff; }
    #counter {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 4;
      padding: 7px 10px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    #overviewButton {
      position: fixed;
      left: 18px;
      bottom: 16px;
      z-index: 4;
      border: 0;
      border-radius: 7px;
      padding: 8px 11px;
      background: rgba(0, 0, 0, 0.58);
      color: #fff;
      cursor: pointer;
    }

    #printStack { display: none; }

    @media print {
      @page { size: 1920px 1080px; margin: 0; }
      html, body { width: 1920px; height: auto; overflow: visible; background: #fff; }
      #overview, #player { display: none !important; }
      #printStack { display: block !important; }
      #printStack iframe {
        display: block;
        width: 1920px;
        height: 1080px;
        border: 0;
        break-after: page;
        page-break-after: always;
      }
      #printStack iframe:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>
<body>
  <main id="overview" aria-label="Slide overview">
    <header class="overview-header">
      <h1 class="overview-title">Slide overview</h1>
      <p class="overview-help">Choose a slide · Arrow keys navigate · Escape returns here</p>
    </header>
    <div id="grid"></div>
  </main>

  <section id="player" aria-label="Slide player">
    <div id="stage"><iframe id="frame" title="Current slide"></iframe></div>
    <button id="overviewButton" type="button">Overview</button>
    <div id="counter" aria-live="polite"></div>
  </section>

  <div id="printStack" aria-hidden="true"></div>

  <script>
    const DECK_MANIFEST = [
      { file: "slides/01-cover.html", label: "Cover" },
      { file: "slides/02-content.html", label: "Content" }
    ];

    (() => {
      "use strict";

      const WIDTH = 1920;
      const HEIGHT = 1080;
      const overview = document.getElementById("overview");
      const grid = document.getElementById("grid");
      const player = document.getElementById("player");
      const stage = document.getElementById("stage");
      const frame = document.getElementById("frame");
      const counter = document.getElementById("counter");
      const printStack = document.getElementById("printStack");
      let current = 0;

      function updateCardScales() {
        grid.querySelectorAll(".card").forEach((card) => {
          const iframe = card.querySelector("iframe");
          iframe.style.transform = `scale(${card.clientWidth / WIDTH})`;
        });
      }

      function buildOverview() {
        grid.replaceChildren();
        DECK_MANIFEST.forEach((slide, index) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "card";
          card.setAttribute("aria-label", `Open slide ${index + 1}: ${slide.label || "Untitled"}`);
          const thumb = document.createElement("span");
          thumb.className = "thumb";
          const preview = document.createElement("iframe");
          preview.src = slide.file;
          preview.tabIndex = -1;
          preview.setAttribute("aria-hidden", "true");
          thumb.append(preview);
          const label = document.createElement("span");
          label.className = "card-label";
          label.textContent = `${index + 1} · ${slide.label || "Untitled"}`;
          card.append(thumb, label);
          card.addEventListener("click", () => showSlide(index));
          grid.append(card);
        });
        requestAnimationFrame(updateCardScales);
      }

      function scaleStage() {
        const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
        const x = (window.innerWidth - WIDTH * scale) / 2;
        const y = (window.innerHeight - HEIGHT * scale) / 2;
        stage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      }

      function showOverview(updateHash = true) {
        overview.style.display = "block";
        player.style.display = "none";
        if (updateHash) history.replaceState(null, "", "#overview");
        requestAnimationFrame(updateCardScales);
      }

      function showSlide(index, updateHash = true) {
        if (!DECK_MANIFEST.length) return;
        current = Math.max(0, Math.min(index, DECK_MANIFEST.length - 1));
        frame.src = DECK_MANIFEST[current].file;
        counter.textContent = `${current + 1} / ${DECK_MANIFEST.length} · ${DECK_MANIFEST[current].label || ""}`;
        overview.style.display = "none";
        player.style.display = "block";
        scaleStage();
        if (updateHash) history.replaceState(null, "", `#slide-${current + 1}`);
      }

      function fromHash() {
        const match = location.hash.match(/^#slide-(\d+)$/);
        if (match) showSlide(Number(match[1]) - 1, false);
        else showOverview(false);
      }

      function buildPrintStack() {
        printStack.replaceChildren();
        DECK_MANIFEST.forEach((slide) => {
          const page = document.createElement("iframe");
          page.src = slide.file;
          page.title = slide.label || "Slide";
          printStack.append(page);
        });
      }

      document.addEventListener("keydown", (event) => {
        if (event.target.matches("input, textarea, [contenteditable]")) return;
        if (player.style.display !== "block") {
          if (event.key === "Enter" && DECK_MANIFEST.length) showSlide(0);
          return;
        }
        if (["ArrowRight", "PageDown", " "].includes(event.key)) {
          event.preventDefault();
          showSlide(current + 1);
        } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
          event.preventDefault();
          showSlide(current - 1);
        } else if (event.key === "Home") {
          event.preventDefault();
          showSlide(0);
        } else if (event.key === "End") {
          event.preventDefault();
          showSlide(DECK_MANIFEST.length - 1);
        } else if (event.key === "Escape") {
          event.preventDefault();
          showOverview();
        }
      });

      document.getElementById("overviewButton").addEventListener("click", () => showOverview());
      window.addEventListener("resize", () => {
        scaleStage();
        updateCardScales();
      });
      window.addEventListener("hashchange", fromHash);
      window.addEventListener("beforeprint", buildPrintStack);

      buildOverview();
      fromHash();
    })();
  </script>
</body>
</html>
